<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'"
      http-equiv="Content-Security-Policy"
    />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <meta content="#07090d" name="theme-color" />
    <title>Offline | Vallective</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .offline-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(124, 92, 255, 0.18),
            transparent 38%
          ),
          #07090d;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }

      .offline-card {
        width: min(100%, 560px);
        padding: clamp(30px, 7vw, 56px);
        border: 1px solid rgba(167, 139, 250, 0.2);
        border-radius: 28px;
        background: rgba(16, 19, 27, 0.98);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      }

      .offline-mark {
        width: 62px;
        height: 62px;
        display: grid;
        place-items: center;
        border-radius: 19px;
        background: linear-gradient(145deg, #a88cff, #6552e8);
        color: white;
        font-size: 28px;
        font-weight: 900;
        transform: skew(-8deg);
        box-shadow: 0 16px 34px rgba(101, 82, 232, 0.3);
      }

      .offline-eyebrow {
        margin: 32px 0 12px;
        color: #a99dff;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: white;
        font-size: clamp(42px, 10vw, 68px);
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .offline-copy {
        margin: 24px 0 0;
        color: #9aa3b5;
        font-size: 16px;
        line-height: 1.7;
      }

      .offline-action {
        margin-top: 30px;
      }

      .offline-action button {
        min-height: 50px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, #8b6dff, #6957dd);
        color: white;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(94, 70, 216, 0.24);
      }

      .offline-action button:focus-visible {
        outline: 3px solid rgba(196, 181, 253, 0.9);
        outline-offset: 4px;
      }

      .offline-note {
        margin: 28px 0 0;
        color: #5f6879;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="offline-shell">
      <section class="offline-card">
        <div aria-hidden="true" class="offline-mark">V</div>
        <p class="offline-eyebrow">Vallective</p>
        <h1>You are offline</h1>
        <p class="offline-copy">
          Your collection remains protected. Reconnect before scanning, saving
          or changing card data, then try again.
        </p>
        <form action="/" class="offline-action" method="get">
          <button type="submit">Try again</button>
        </form>
        <p class="offline-note">
          Vallective does not cache private collection data on this fallback
          screen.
        </p>
      </section>
    </main>
  </body>
</html>
