    <use href="#v1" x="362" y="312" width="96" height="96" />
    <use href="#v1" x="563" y="344" width="64" height="64" />
    <use href="#v1" x="731" y="360" width="48" height="48" />
    <use href="#v1" x="884" y="376" width="32" height="32" />
    <use href="#v1" x="1018" y="384" width="24" height="24" />
    <use href="#v1" x="1142" y="392" width="16" height="16" />

    <use href="#v2" x="362" y="487" width="96" height="96" />
    <use href="#v2" x="563" y="519" width="64" height="64" />
    <use href="#v2" x="731" y="535" width="48" height="48" />
    <use href="#v2" x="884" y="551" width="32" height="32" />
    <use href="#v2" x="1018" y="559" width="24" height="24" />
    <use href="#v2" x="1142" y="567" width="16" height="16" />

    <use href="#v3" x="362" y="662" width="96" height="96" />
    <use href="#v3" x="563" y="694" width="64" height="64" />
    <use href="#v3" x="731" y="710" width="48" height="48" />
    <use href="#v3" x="884" y="726" width="32" height="32" />
    <use href="#v3" x="1018" y="734" width="24" height="24" />
    <use href="#v3" x="1142" y="742" width="16" height="16" />

    <rect x="1280" y="292" width="230" height="486" rx="38" fill="#10131A" stroke="#2C2F40" />
    <text x="1320" y="348" fill="#CBAE72" font-size="18" font-weight="700" letter-spacing="3">RESULT</text>
    <text x="1320" y="405" fill="#F5F7FB" font-size="30" font-weight="700">V2 stays open</text>
    <text x="1320" y="447" fill="#8991A4" font-size="20">Its two clean strokes</text>
    <text x="1320" y="479" fill="#8991A4" font-size="20">remain identifiable at</text>
    <text x="1320" y="511" fill="#8991A4" font-size="20">the smallest size.</text>
    <line x1="1320" y1="558" x2="1470" y2="558" stroke="#CBAE72" stroke-width="3" />
    <text x="1320" y="612" fill="#A99BFF" font-size="18" font-weight="700" letter-spacing="2">A+B PRINCIPLE</text>
    <text x="1320" y="656" fill="#8991A4" font-size="20">Violet owns the mark.</text>
    <text x="1320" y="688" fill="#8991A4" font-size="20">Champagne adds warmth</text>
    <text x="1320" y="720" fill="#8991A4" font-size="20">around it—not inside it.</text>
  </g>

  <text x="90" y="910" fill="#586073" font-family="Arial, Helvetica, sans-serif" font-size="20">Brand-only exploration · no product code changed</text>
</svg>
